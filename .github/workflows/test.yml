name: Test Infisical secret source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned test tools
        run: python -m pip install pytest==8.3.5 ruff==0.9.10 pyyaml==6.0.2
      - name: Lint
        run: ruff check .
      - name: Validate manifest and Python syntax
        run: python -c "import pathlib, yaml; yaml.safe_load(pathlib.Path('plugin.yaml').read_text())"
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/hermes_api
        run: python -m pytest
